name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: System checks
        run: python manage.py check
      - name: Unit tests
        run: python manage.py test --tag unit
      - name: Functional tests
        run: python manage.py test --tag functional
      - name: Startup self-test
        run: |
          python manage.py migrate --noinput
          python manage.py selftest --strict

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck -x start.sh test.sh entrypoint.sh docker/entrypoint.sh docker/entrypoint-web.sh

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-validation-only
    steps:
      - uses: actions/checkout@v4
      - name: Provide .env for env_file references
        run: cp .env.example .env
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.test.yml config -q
