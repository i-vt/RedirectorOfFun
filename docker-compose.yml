services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redirector_panel}
      POSTGRES_USER: ${POSTGRES_USER:-redirector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  panel:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-redirector}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-redirector_panel}
      NGINX_JSON_LOG_PATH: /var/log/nginx/access.json
    # Direct panel access is internal only; the web tier publishes 80/443.
    # To reach the panel directly (e.g. SSH tunnel when the edge profile
    # owns 80/443), uncomment a localhost bind:
    # ports:
    #   - "127.0.0.1:3000:3000"
    volumes:
      - nginx-logs:/var/log/nginx:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["panelweb"]
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Operator IP whitelisting (disabled by default; the service listens on
      # 0.0.0.0 like a regular web service). To restrict access by source IP,
      # either bind the ports to a specific interface, e.g.:
      #   - "203.0.113.10:80:80"
      #   - "203.0.113.10:443:443"
      # or use the commented allow/deny rules in docker/panel-web.conf.
    volumes:
      # Holds the certificate in use. With PANEL_DOMAIN set, these are links
      # into the persisted letsencrypt store; otherwise a generated
      # self-signed pair. Reset wipes this directory.
      - ./docker/certs:/etc/nginx/certs
      # Let's Encrypt account + certificate store (persisted across resets so
      # a reset does not re-request and burn rate limits).
      - ./docker/letsencrypt:/etc/letsencrypt
      # 404 telemetry for the collector (see panel-web.conf).
      - nginx-logs:/var/log/nginx
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-}
    depends_on:
      panel:
        condition: service_healthy

  collector:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "ingest_404_logs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-redirector}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-redirector_panel}
      NGINX_JSON_LOG_PATH: /var/log/nginx/access.json
    volumes:
      - nginx-logs:/var/log/nginx:ro
    depends_on:
      panel:
        condition: service_healthy

  notification-worker:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "deliver_notifications"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-redirector}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-redirector_panel}
    depends_on:
      panel:
        condition: service_healthy

  telegram-worker:
    build: .
    restart: "no"
    command: ["python", "manage.py", "poll_telegram"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-redirector}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-redirector_panel}
    depends_on:
      panel:
        condition: service_healthy

  redirector:
    profiles: ["edge"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      C2_SERVER: ${C2_SERVER}
      C2_SCHEME: ${C2_SCHEME:-http}
      UA_PATTERN: ${UA_PATTERN:-}
      PANEL_UPSTREAM: ${PANEL_UPSTREAM:-panel:3000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./docker/blocklist.conf:/etc/nginx/blocklist.conf
      - ./docker/banlist.conf:/etc/nginx/banlist.conf
      - ./docker/agent_routes.conf:/etc/nginx/agent_routes.conf
      - nginx-logs:/var/log/nginx

volumes:
  postgres-data:
  letsencrypt:
  nginx-logs:
    name: redirector-nginx-logs
