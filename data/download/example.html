<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download</title>
<style>
  html,body{margin:0;height:100%;background:#fbfbfd;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d1d1f}
  .wrap{height:100%;display:grid;place-items:center}
  .card{background:#fff;border:1px solid #e8e8eb;border-radius:14px;padding:30px 36px;max-width:420px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.06)}
  h1{font-size:17px;margin:0 0 8px}
  p{font-size:13px;color:#6e6e73;margin:0 0 10px}
  small{font-size:11px;color:#86868b}
  a{color:#0071e3;text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Your download is ready</h1>
      <p>%FILENAME% should start automatically.</p>
      <small>If nothing happens, <a href="%DOWNLOAD_URL%">download it directly</a>.</small>
    </div>
  </div>
  <a id="dl" href="%DOWNLOAD_URL%" download="%FILENAME%" hidden></a>
<script>
  document.getElementById("dl").click();
  setTimeout(() => { window.location.href = "%TARGET%"; }, 1800);
</script>
</body>
</html>
