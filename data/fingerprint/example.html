<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifying your session</title>
<style>
  html,body{margin:0;height:100%;background:#fbfbfd;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d1d1f}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .ring{width:30px;height:30px;border-radius:50%;border:3px solid #e3e3e6;border-top-color:#0071e3;animation:sp 1s linear infinite}
  p{font-size:13px;color:#6e6e73;margin:0}
  small{font-size:11px;color:#86868b}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <p id="state">Verifying your session&hellip;</p>
    <small>This takes a moment.</small>
  </div>
<script>
(() => {
  // Contract: POST {"fingerprint": {...}} to the same URL, then act like a
  // loading page. See docs/fingerprint-pages.md.
  const fp = {
    ua: navigator.userAgent,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: [screen.width, screen.height, screen.colorDepth],
    cores: navigator.hardwareConcurrency || 0,
    touch: navigator.maxTouchPoints || 0,
  };
  fetch(location.pathname + location.search, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({fingerprint: fp}),
  }).finally(() => {
    document.getElementById("state").textContent = "Loading content…";
    setInterval(() => location.reload(), 6000);
  });
})();
</script>
</body>
</html>
