# Control plane web tier.
# Puts the panel on the standard ports: HTTP on 80, HTTPS on 443.
# TLS uses a self-signed certificate generated on first container start;
# mount real certificates into docker/certs to replace it (see docker-compose.yml).

# 404 telemetry: emit the same structured JSON the edge writes, so the
# panel's collector feeds the 404 Events page. The volume mount in
# docker-compose.yml places this file where the collector reads it.
error_log /dev/stderr;
access_log /dev/stdout combined;

map $status $log_404 {
    default 0;
    404     1;
}
log_format json_analytics escape=json '{'
    '"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"remote_addr":"$remote_addr",'
    '"user_agent":"$http_user_agent"'
'}';
access_log /var/log/nginx/access.json json_analytics if=$log_404;

upstream panel_backend {
    server panel:3000;
    keepalive 16;
}

# Operator IP whitelisting is DISABLED by default: the panel listens on
# 0.0.0.0 like any regular web service. To restrict it to known operator
# addresses, uncomment the allow/deny lines in each server block below and
# adjust the addresses (single IPs or CIDR ranges both work):
#
#     allow 203.0.113.10;
#     allow 198.51.100.0/24;
#     deny all;
#
# Alternative at the compose level: bind the published ports to a specific
# host interface instead of 0.0.0.0 (see the ports comments in
# docker-compose.yml).

server {
    listen 80 default_server;
    server_tokens off;
    client_max_body_size 64m;

    # ACME challenge for real certificate requests (PANEL_DOMAIN set).
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl default_server;
    server_tokens off;
    client_max_body_size 64m;

    #hsts# add_header Strict-Transport-Security "max-age=<HSTS_MAX_AGE>" always;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
